name: Deploy public site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble public artifact
        run: |
          mkdir -p "$RUNNER_TEMP/public-site"
          cp index.html apply.html privacy.html config.js "$RUNNER_TEMP/public-site/"
          cp -R assets "$RUNNER_TEMP/public-site/assets"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/public-site
      - id: deployment
        uses: actions/deploy-pages@v4
