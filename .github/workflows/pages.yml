name: Deploy public site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The fellows repo asks for a rebuild after each merge (see its README).
  repository_dispatch:
    types: [fellows-updated]
  # Daily rebuild, so /fellows stays current even without that token.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Assemble public artifact
        run: |
          mkdir -p "$RUNNER_TEMP/public-site"
          cp index.html privacy.html config.js "$RUNNER_TEMP/public-site/"
          cp -R assets "$RUNNER_TEMP/public-site/assets"
      - name: Get the fellows page source
        uses: actions/checkout@v5
        with:
          repository: hodifellows/fellows
          path: fellows-src
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the fellows page into /fellows
        run: |
          if [ -f fellows-src/scripts/build.py ]; then
            pip install -r fellows-src/requirements.txt
            python fellows-src/scripts/build.py --out "$RUNNER_TEMP/public-site/fellows"
          else
            echo "The fellows repo has no build script yet; skipping /fellows."
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/public-site

  # Deploying in its own job, after the upload has finished, avoids the
  # "No artifacts named github-pages were found" error.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
